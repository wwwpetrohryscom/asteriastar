# Netlify configuration for Asteria Star.
#
# The site is a Next.js 16 App Router application: ~9,200 prerendered pages,
# 30 server-rendered routes, and 27 Open Data / Live Sky / provenance API
# handlers. Everything below exists to reproduce the previous Vercel production
# behaviour exactly — nothing here changes application semantics.
#
# Rendering is handled by the official Next.js Runtime (@netlify/plugin-nextjs,
# the OpenNext-based adapter, pinned as a devDependency so local, preview, and
# production builds all resolve the same version). The runtime derives the
# publish directory, the server handler, and the Image CDN wiring from the Next
# build output, so none of those are configured by hand here.

[build]
  command = "npm run build"
  # `publish` is intentionally NOT set: the Next.js Runtime resolves it from the
  # build output. Hard-coding it here would conflict with the adapter.

[build.environment]
  # Next.js 16 requires Node >= 20.9. Pinned to the current LTS so local,
  # Deploy Preview, and production builds are reproducible.
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"
  # INDEXNOW_KEY is a PUBLIC verification token, not a credential. The IndexNow
  # protocol requires the key to be served at /<key>.txt on the site's own
  # domain, so it is committed at public/c292fa58c74f45f9ad982e152b4f7c1c.txt and
  # documented in the README. Knowing it grants nothing: IndexNow validates a
  # submission against the file hosted on the host being submitted for.
  #
  # Netlify's secrets scanner is therefore guaranteed to "find" it — in the very
  # file the protocol requires — and would fail every production build. Excluding
  # the key by name is the correct resolution; suppressing the scanner wholesale
  # (SECRETS_SCAN_ENABLED = "false") is not, because it would also stop it
  # catching a genuine credential leak.
  SECRETS_SCAN_OMIT_KEYS = "INDEXNOW_KEY"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ---------------------------------------------------------------------------
# Deploy contexts
# ---------------------------------------------------------------------------
# Only production may speak as asteriastar.com. Canonical URLs, og:url, JSON-LD,
# the sitemap, llms.txt and the OpenAPI server URL all derive from
# NEXT_PUBLIC_SITE_URL, so pinning it per context is what keeps a Deploy Preview
# from emitting production URLs — and production from ever emitting a
# *.netlify.app URL.

[context.production.environment]
  # Explicit rather than relying on the in-code fallback. Same value the Vercel
  # production deployment resolved to, so canonical identity is unchanged.
  NEXT_PUBLIC_SITE_URL = "https://asteriastar.com"

# Preview builds derive their own origin from Netlify's DEPLOY_PRIME_URL. The
# interpolation happens in the build shell (netlify.toml does not expand
# variables inside [*.environment] tables), which is why this is expressed as a
# per-context build command rather than an environment value.
[context.deploy-preview]
  command = "NEXT_PUBLIC_SITE_URL=\"$DEPLOY_PRIME_URL\" npm run build"

[context.branch-deploy]
  command = "NEXT_PUBLIC_SITE_URL=\"$DEPLOY_PRIME_URL\" npm run build"

# INDEXNOW_KEY is deliberately NOT declared here. It is stored as a Netlify
# environment variable scoped to the production context only, so a preview or
# branch deploy cannot notify a search engine even if /api/indexnow is called:
# without the key the endpoint returns 503 and the submit script refuses to run.

# ---------------------------------------------------------------------------
# Headers — parity with the previous Vercel production responses
# ---------------------------------------------------------------------------
# Vercel added HSTS to every response automatically; Netlify does not, so it is
# declared explicitly with the identical max-age (63072000 = 2 years). This is
# the only header Vercel contributed that the application does not emit itself.
# Cache-Control, CORS and Content-Type all come from the route handlers and from
# Next.js, and are therefore already platform-portable.

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000"
    # Vercel served `Access-Control-Allow-Origin: *` on every static response —
    # pages, assets, robots.txt, sitemap.xml, and the force-static Open Data
    # endpoints (/api/v0/sources, /api/v0/openapi.json, …). It is a platform
    # header there, not something the application emits, so browser clients of
    # the public API depend on something Netlify does not provide by default.
    # The site is entirely public and read-only, and `*` forbids credentialed
    # requests by definition, so reproducing it site-wide is exact parity.
    Access-Control-Allow-Origin = "*"

# ---------------------------------------------------------------------------
# NOTE: the API cache key is NOT configured here
# ---------------------------------------------------------------------------
# It has to be, and is, declared by the responses themselves — see
# CACHE_KEY_IS_FULL_URL in src/platform/open-data/api.ts.
#
# A `[[headers]]` rule with `Netlify-Vary = "query"` for /api/* was tried first
# and verified NOT to work: netlify.toml header rules apply to files in the
# publish directory, not to responses produced by the Next.js server function,
# which is what serves every route handler. The rule deployed cleanly, reported
# as applied in the build log, and changed nothing — the collision was still
# reproducible against the live deploy afterwards.
#
# Keep that in mind before adding any header rule here that is meant to affect a
# dynamic route: confirm it on a real deploy rather than trusting the build log.

# Non-production deploys must never be indexed, on whatever hostname Netlify
# assigns them.
[[context.deploy-preview.headers]]
  for = "/*"
  [context.deploy-preview.headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[context.branch-deploy.headers]]
  for = "/*"
  [context.branch-deploy.headers.values]
    X-Robots-Tag = "noindex, nofollow"

# ---------------------------------------------------------------------------
# Redirects — www → apex
# ---------------------------------------------------------------------------
# CHANGED DELIBERATELY, and in the opposite direction to the original plan.
#
# Vercel production served www and 308'd the apex to it. That policy was going
# to be reproduced exactly — until the Vercel deployment was removed while the
# apex A record already pointed at Netlify, which left production down: the apex
# had no certificate, and www answered Vercel's DEPLOYMENT_NOT_FOUND.
#
# The apex is now the primary domain, because it is the hostname the site has
# always declared as canonical: every page's <link rel="canonical">, every
# og:url, every JSON-LD url, and all 8,671 sitemap entries say
# https://asteriastar.com. Under the old policy that canonical pointed at a host
# that immediately redirected elsewhere — it was never self-referential. Serving
# the apex makes it self-referential for the first time, and needs no content,
# sitemap, or metadata change to do it.
#
# NOTE, added after measuring production: these rules are INERT. Netlify's own primary-domain
# redirect fires before them, and `https://www.asteriastar.com/x` answers 301, not the 308 declared
# here. They are kept as an explicit statement of the policy and as a fallback if the primary-domain
# setting ever changes — but the status code below is not the one served, and an earlier version of
# this comment asserted that it was.

# ---------------------------------------------------------------------------
# /blog — proxied to the independent AsteriaStar Journal project
# ---------------------------------------------------------------------------
# One public hostname, two deployment units. `asteriastar.com/blog/*` is served by a SEPARATE Netlify
# project (`asteriastar-blog`, same team) with its own repository, its own build and its own deploy
# history — so publishing an article does not rebuild this nine-thousand-page platform, and a change
# to the scientific data layer does not rebuild the publication.
#
# `status = 200` makes this a REWRITE, not a redirect: Netlify fetches the response and returns it
# under the original URL. The visitor's address bar keeps saying asteriastar.com/blog/… and the
# blog project's *.netlify.app hostname — which appears here, and only here, in the whole
# architecture — is never exposed to a browser or a crawler.
#
# WHY THIS IS SAFE, from Netlify's documented behaviour rather than from assumption:
#
#   · Order of evaluation is `_redirects`, then THIS FILE, then static files, then the Next.js
#     server function. "Any Netlify redirects or rewrites that you create take precedence over those
#     created by Next.js Runtime." The application never sees a /blog request.
#   · It is not the forbidden case. The documentation warns specifically against rewriting from the
#     site root, which "would take precedence over Next.js Runtime's generated rewrites and break
#     routing on your site". This is a prefix, and `/blog` is otherwise unclaimed — no route, no
#     sitemap entry, a 404 before this rule existed.
#   · Cross-project rewrites are permitted within a team and forbidden across teams. Both projects
#     are on the same team, and the documentation recommends exactly this form: target the
#     `.netlify.app` subdomain rather than a custom domain.
#   · Internal rewrites are limited to one hop. The blog serves its own responses and proxies
#     nothing, so the budget is spent once.
#
# The blog application sets `basePath: "/blog"`, so its own asset URLs are already
# `/blog/_next/static/…` and match the second rule below. Nothing of the publication's can fall
# through to this platform and 404.
#
# `force = true` because `force` means "override any existing content in the path". Nothing occupies
# /blog today; the rule should not silently stop working if something ever does.
#
# FAILURE MODE: if the blog project is down, /blog/* fails and NOTHING ELSE DOES. Entity pages, the
# Open Data API, Live, Search and the sitemap are served by this platform's own function and never
# touch the proxy. That containment is the point of the split.
#
# ROLLBACK: delete these two blocks and redeploy. /blog returns to 404 and this site is unchanged.
# Full procedure in docs/blog-routing-rollback.md.

# There is deliberately NO trailing-slash normalisation rule for `/blog/`.
#
# One was tried and reverted, and the reason is worth keeping. Netlify's matcher folds the two slash
# forms onto each other — which is why `from = "/blog"` below also serves `/blog/`. The folding is
# symmetric: a rule written `from = "/blog/"` matches the bare `/blog` too. So `/blog/ → /blog` with
# status 308 redirected `/blog` to itself, and the publication's homepage answered an infinite
# redirect loop while every child path kept working. It reached production before the routing gate
# next ran.
#
# The consequence of not normalising is that the homepage answers 200 at both `/blog` and `/blog/`.
# That is a duplicate URL, not a broken one, and it is already resolved the way duplicate URLs are
# meant to be: every page of the publication carries `<link rel="canonical">` pointing at the
# no-slash form, and only that form appears in the sitemap. Search engines are told which is real.
[[redirects]]
  from = "/blog"
  to = "https://asteriastar-blog.netlify.app/blog"
  status = 200
  force = true

[[redirects]]
  from = "/blog/*"
  to = "https://asteriastar-blog.netlify.app/blog/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://www.asteriastar.com/*"
  to = "https://asteriastar.com/:splat"
  status = 308
  force = true

[[redirects]]
  from = "http://www.asteriastar.com/*"
  to = "https://asteriastar.com/:splat"
  status = 308
  force = true
