name: Journal integration

# The cross-project gates, run against LIVE production.
#
# Four checks that exercise the architecture rather than reasoning about it: the proxy still serves
# the publication under this hostname, the Journal is still findable from this site's navigation, the
# feed the homepage reads still says what the homepage expects, and global search still finds
# articles. All four depend on a SEPARATE deployment that this repository does not build and does not
# control, so none of them can be settled at build time — only by asking production.
#
# This is the only check in either repository that exercises the architecture rather than reasoning
# about it — and until this workflow existed it ran nowhere. `npm run blog:routing` was defined and
# nothing called it: not the `validate` chain, not CI. That meant the two `[[redirects]]` blocks in
# netlify.toml — dropping `force`, retargeting the host, inserting a rule above them — could be
# changed and shipped with everything green, on the one seam the split exists to protect.
#
# It runs against production rather than against a pull request, deliberately. A PR cannot test its
# own proxy rule: the rule only exists once deployed, and the deploy-preview URL is not known to this
# workflow. What CI can do is notice quickly when production breaks — after a merge, on a schedule,
# and on demand. Verifying a CHANGE to the rules is a manual step against that PR's deploy preview,
# and the pull-request template says so.

on:
  push:
    branches: [main]
    # Only the files that can actually affect routing.
    paths:
      - "netlify.toml"
      - "scripts/blog/**"
      - "src/app/robots.ts"
      # The navigation model and the components that render it: the Journal's visibility lives here,
      # and a change that quietly drops it should be caught by the next run rather than by a reader.
      - "src/lib/navigation.ts"
      - "src/lib/journal/**"
      - "src/components/site/**"
      - "src/components/home/JournalLatest.tsx"
      # This file. A change to a gate should re-run the gate — the commit that added the retry below
      # did not trigger this workflow, because the workflow was not in its own filter.
      - ".github/workflows/journal-integration.yml"
  schedule:
    # Twice a day. The blog deploys independently and often; a rule that silently stops matching, or a
    # blog project that moves, should not wait for someone to notice by hand.
    - cron: "17 6,18 * * *"
  workflow_dispatch:
    inputs:
      origin:
        description: "Origin to test (default: production). Use a deploy-preview URL to prove a change before merging."
        required: false
        default: "https://asteriastar.com"

concurrency:
  group: journal-integration
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A push to main triggers a deploy, and the presence gate asserts against what that deploy
      # publishes. A fixed sleep was wrong for this: the first run of this workflow waited two
      # minutes, tested the PREVIOUS production, and reported the very defect the merge had just
      # fixed. This site builds ~8,850 pages, which takes several minutes and will take longer as it
      # grows, so the wait is now a floor rather than the whole budget — the gate below retries.
      - name: Wait for the deployment to start publishing
        if: github.event_name == 'push'
        run: sleep 180
      - name: Verify same-host routing
        run: npm run blog:routing ${{ github.event.inputs.origin || 'https://asteriastar.com' }}

      # Each of the three below is independent of the others, so `if: always()` lets one failure
      # report all of them rather than hiding the rest behind the first.
      # Retried, because this is the one gate whose subject is what the deploy just published. On a
      # schedule or a manual run production is already settled and the first attempt passes; after a
      # push it may take several more minutes. A real regression still fails — it just fails after
      # the budget rather than before the deploy has landed.
      - name: Verify the Journal is findable
        if: always()
        env:
          ORIGIN: ${{ github.event.inputs.origin || 'https://asteriastar.com' }}
        run: |
          attempts=12
          for i in $(seq 1 $attempts); do
            if npm run journal:presence "$ORIGIN"; then exit 0; fi
            if [ "$i" -lt "$attempts" ]; then
              echo "::notice::attempt $i/$attempts did not pass; the deploy may still be publishing — retrying in 60s"
              sleep 60
            fi
          done
          echo "::error::the Journal is not reachable from the global navigation on $ORIGIN"
          exit 1

      - name: Verify the Journal feed contract
        if: always()
        run: npm run journal:feed

      - name: Verify global search finds Journal articles
        if: always()
        run: npm run journal:search
